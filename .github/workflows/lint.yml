name: Lint

# Revisa todo src/ (formato y clang-tidy), no solo los archivos que cambia el PR.
on:
  push:
    branches: [main]
    paths: ["src/**", ".clang-format", ".clang-tidy", ".cmake/Tools.cmake", ".github/workflows/lint.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**", ".clang-format", ".clang-tidy", ".cmake/Tools.cmake", ".github/workflows/lint.yml"]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CXX: clang++-18

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-format-18 clang-tidy-18

      # Los paquetes instalan clang-format-18 y clang-tidy-18, no los nombres sin versión: se indican al configurar.
      # El preset Release genera compile_commands.json, que clang-tidy necesita.
      - name: Configurar
        run: >
          cmake --preset Release
          -DPROJ_CLANG_FORMAT=/usr/bin/clang-format-18
          -DPROJ_CLANG_TIDY=/usr/bin/clang-tidy-18

      - name: Formato (clang-format)
        run: cmake --build --preset Release --target format-check

      - name: Análisis estático (clang-tidy)
        run: cmake --build --preset Release --target lint
